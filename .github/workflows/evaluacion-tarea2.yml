name: "Evaluación Híbrida — Tarea 2 (Workshop 2: AI IT Assistant)"

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

jobs:
  evaluar-tarea-2:
    if: contains(github.event.issue.labels.*.name, 'tarea-2')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar Tarea 2 (60% Auto + 40% Peer | 30% Auto + 30% Peer + 40% Profesor)
        uses: actions/github-script@v7
        with:
          script: |
            // Lista de usuarios de GitHub autorizados como profesores (en minúsculas)
            const TEACHERS = ['jjbonnin'];

            const PEER_MAP = {
              A1: 'A3', A2: 'A4', A3: 'A5', A4: 'A6', A5: 'A1', A6: 'A2',
              B1: 'B3', B2: 'B4', B3: 'B5', B4: 'B6', B5: 'B1', B6: 'B2'
            };

            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            const turnoMatch = body.match(/### Turno\s+Turno\s+([AB])/i);
            const turno = turnoMatch ? turnoMatch[1].toUpperCase() : null;

            const grupoMatch = body.match(/### Identificador de Grupo[^\n]*\n+([AB][1-6])/i);
            const grupo = grupoMatch ? grupoMatch[1].toUpperCase() : null;

            const titleGrupoMatch = title.match(/\[Grupo-([AB][1-6])\]/i);
            const titleGrupo = titleGrupoMatch ? titleGrupoMatch[1].toUpperCase() : null;

            const reviewerGroup = grupo ? PEER_MAP[grupo] : null;

            let autoRaw = 0;
            const autoChecks = [];

            // 1. Coherencia Título + Grupo + Turno + Roles con nombres reales (20 pts)
            const turnoCoherente = !turno || (grupo && grupo.startsWith(turno));
            const membersBlock = body.split('### Integrantes y Roles')[1]?.split('###')[0] || '';
            const roleLines = membersBlock
              .trim()
              .split('\n')
              .filter(l => /^-\s*[^:]+:\s*\S{2,}/i.test(l.trim()));

            // Extraer miembros del propio grupo para impedir autoevaluación
            const ownTeamMembers = new Set([
              (issue.user?.login || '').toLowerCase(),
              ...[...membersBlock.matchAll(/@([a-zA-Z0-9-]+)/g)].map(m => m[1].toLowerCase())
            ]);

            if (grupo && titleGrupo === grupo && turnoCoherente && roleLines.length >= 4) {
              autoRaw += 20;
              autoChecks.push(`✅ **Identificación coherente (\`Grupo-${grupo}\`, Turno ${turno}) y ${roleLines.length} roles completos:** 20/20`);
            } else {
              autoChecks.push(`❌ **Identificación o roles incompletos:** Verifica \`[Grupo-${grupo || 'A1'}]\` en el título, coherencia con Turno ${turno || '?'} y al menos 4 roles con nombre (${roleLines.length}/4) (0/20).`);
            }

            // 2. Escenario 01: Logs, Prompt estructurado y Verificación (20 pts)
            const s1Block = body.split('### Escenario 01:')[1]?.split('###')[0] || '';
            const s1HasLog = /(error|failed|systemd|service|journalctl|systemctl|log)/i.test(s1Block);
            const s1HasPrompt = /(environment|entorno|symptom|síntoma|constraint|restricci|output|prompt)/i.test(s1Block);
            if (s1Block.trim().length >= 120 && s1HasLog && s1HasPrompt) {
              autoRaw += 20;
              autoChecks.push(`✅ **Escenario 01 (Evidencia de logs + prompt estructurado):** 20/20`);
            } else {
              autoChecks.push(`❌ **Escenario 01 incompleto:** Incluye evidencia de logs/servicio y el prompt estructurado (0/20).`);
            }

            // 3. Escenario 02: Depuración de diagnostic_script.py (25 pts)
            const s2Block = body.split('### Escenario 02:')[1]?.split('###')[0] || '';
            const s2HasFix = /(diagnostic_script|syntax|import|psutil|subprocess|exception|try|json|bug|error|fallo)/i.test(s2Block);
            if (s2Block.trim().length >= 100 && s2HasFix) {
              autoRaw += 25;
              autoChecks.push(`✅ **Escenario 02 (Depuración de \`diagnostic_script.py\` documentada):** 25/25`);
            } else {
              autoChecks.push(`❌ **Escenario 02 incompleto:** Detalla los fallos corregidos en \`diagnostic_script.py\` y su salida verificada (0/25).`);
            }

            // 4. Escenario 03: Auditoría de los 3 comandos trampa (25 pts)
            const s3Block = body.split('### Escenario 03:')[1]?.split('###')[0] || '';
            const has777 = /777/.test(s3Block);
            const hasUfw = /ufw/i.test(s3Block);
            const hasRm = /rm\s+-rf|\/var\/log/i.test(s3Block);
            const hasSafeAlt = /(chmod\s+75[05]|chmod\s+64[04]|ufw\s+allow|ufw\s+status|logrotate|truncate|journalctl\s+--vacuum)/i.test(s3Block);

            if (has777 && hasUfw && hasRm && hasSafeAlt && s3Block.trim().length >= 150) {
              autoRaw += 25;
              autoChecks.push(`✅ **Escenario 03 (3 trampas analizadas con alternativas seguras):** 25/25`);
            } else {
              autoChecks.push(`❌ **Escenario 03 incompleto:** Analiza los 3 comandos (\`chmod 777\`, \`ufw disable\`, \`rm -rf /var/log/*\`) e incluye comandos alternativos seguros (0/25).`);
            }

            // 5. Higiene y Checkboxes finales (10 pts) + Penalización de seguridad (-15 pts)
            const hygieneChecked = (body.match(/- \[x\] (?:Confirmo que NO|Worksheets completados)/gi) || []).length;
            if (hygieneChecked >= 2) {
              autoRaw += 10;
              autoChecks.push(`✅ **Higiene de laboratorio y Worksheets confirmados (2/2):** 10/10`);
            } else {
              autoChecks.push(`❌ **Faltan confirmaciones finales (${hygieneChecked}/2):** Marca las casillas de seguridad y worksheets (0/10).`);
            }

            const execText = `${s1Block}\n${s2Block}`;
            if (/(?:^|\n)\s*(?:\$|#|ubtadmin@|root@).*?(?:chmod\s+-R\s+777\s+\/var\/www|ufw\s+disable|rm\s+-rf\s+\/var\/log\/\*)/m.test(execText)) {
              autoRaw = Math.max(0, autoRaw - 15);
              autoChecks.push(`🚨 **Penalización de seguridad (-15 pts):** Se detectó ejecución en terminal de un comando prohibido del Escenario 03.`);
            }

            // Obtener integrantes registrados del grupo revisor asignado (desde Tarea 0 o Tarea 2)
            let allowedReviewers = null;
            if (reviewerGroup) {
              const { data: reviewerIssues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                labels: `grupo-${reviewerGroup}`,
                state: 'all',
                per_page: 10
              });
              if (reviewerIssues.length > 0) {
                allowedReviewers = new Set();
                for (const ri of reviewerIssues) {
                  if (ri.user?.login) allowedReviewers.add(ri.user.login.toLowerCase());
                  const rBlock = (ri.body || '').split('### Integrantes')[1]?.split('###')[0] || '';
                  for (const m of rBlock.matchAll(/@([a-zA-Z0-9-]+)/g)) {
                    allowedReviewers.add(m[1].toLowerCase());
                  }
                }
              }
            }

            // Leer comentarios para Peer-to-Peer y Profesor
            const labels = issue.labels.map(l => l.name);
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber
            });

            let peerScore = null;
            let peerAuthor = null;
            let rejectedPeerMsg = null;
            let teacherScore = null;
            let gradedBy = null;

            for (const c of comments) {
              if (c.user?.type === 'Bot') continue;
              const login = (c.user?.login || '').toLowerCase();
              const commentBody = c.body || '';

              if (TEACHERS.includes(login)) {
                const tMatch = commentBody.match(/TEACHER-SCORE:\s*(\d{1,3})/i);
                if (tMatch) {
                  teacherScore = Math.min(100, Math.max(0, parseInt(tMatch[1], 10)));
                  gradedBy = c.user.login;
                }
              }

              const pMatch = commentBody.match(/PEER-SCORE:\s*(\d{1,3})/i);
              if (pMatch) {
                if (ownTeamMembers.has(login) && !TEACHERS.includes(login)) {
                  rejectedPeerMsg = `⚠️ Nota Peer de \`@${c.user.login}\` ignorada: pertenece al mismo grupo evaluado (\`${grupo}\`).`;
                  continue;
                }
                if (allowedReviewers && !allowedReviewers.has(login) && !TEACHERS.includes(login)) {
                  rejectedPeerMsg = `⚠️ Nota Peer de \`@${c.user.login}\` ignorada: no figura como integrante del grupo revisor asignado (\`${reviewerGroup}\`).`;
                  continue;
                }
                peerScore = Math.min(100, Math.max(0, parseInt(pMatch[1], 10)));
                peerAuthor = c.user.login;
                rejectedPeerMsg = null;
              }
            }

            const hasTeacherReview = labels.includes('teacher-review') || teacherScore !== null;
            let finalScore = 0;
            let modeText = '';
            let breakdownRows = '';

            if (hasTeacherReview) {
              const autoW = +(autoRaw * 0.3).toFixed(1);
              const peerW = peerScore !== null ? +(peerScore * 0.3).toFixed(1) : 0;
              const teacherW = teacherScore !== null ? +(teacherScore * 0.4).toFixed(1) : 0;
              finalScore = +(autoW + peerW + teacherW).toFixed(1);
              modeText = '30% Automática + 30% Peer-to-Peer + 40% Profesor';
              breakdownRows =
                `| Evaluación Automática (30%) | ${autoRaw} / 100 | **${autoW} / 30 pts** |\n` +
                `| Evaluación Peer-to-Peer (30%) | ${peerScore !== null ? `${peerScore} / 100 (por @${peerAuthor})` : `Pendiente (Grupo ${reviewerGroup || '?'})`} | **${peerW} / 30 pts** |\n` +
                `| Evaluación Profesor (40%) | ${teacherScore !== null ? `${teacherScore} / 100 (por @${gradedBy})` : 'Pendiente (`TEACHER-SCORE: XX`)'} | **${teacherW} / 40 pts** |`;
            } else {
              const autoW = +(autoRaw * 0.6).toFixed(1);
              const peerW = peerScore !== null ? +(peerScore * 0.4).toFixed(1) : 0;
              finalScore = +(autoW + peerW).toFixed(1);
              modeText = '60% Automática + 40% Peer-to-Peer';
              breakdownRows =
                `| Evaluación Automática (60%) | ${autoRaw} / 100 | **${autoW} / 60 pts** |\n` +
                `| Evaluación Peer-to-Peer (40%) | ${peerScore !== null ? `${peerScore} / 100 (por @${peerAuthor})` : `Pendiente (Grupo ${reviewerGroup || '?'})`} | **${peerW} / 40 pts** |`;
            }

            const passed = finalScore >= 70 && peerScore !== null && (!hasTeacherReview || teacherScore !== null);

            // Gestión de etiquetas
            const labelsToAdd = [];
            if (grupo) labelsToAdd.push(`grupo-${grupo}`);
            if (turno) labelsToAdd.push(`turno-${turno}`);
            labelsToAdd.push(peerScore !== null ? 'peer:done' : 'peer:pending');
            labelsToAdd.push(autoRaw >= 70 ? 'auto:passed' : 'auto:failed');
            if (teacherScore !== null) labelsToAdd.push('teacher:graded');

            const toRemove = [];
            if (peerScore !== null && labels.includes('peer:pending')) toRemove.push('peer:pending');
            if (peerScore === null && labels.includes('peer:done')) toRemove.push('peer:done');
            if (autoRaw >= 70 && labels.includes('auto:failed')) toRemove.push('auto:failed');
            if (autoRaw < 70 && labels.includes('auto:passed')) toRemove.push('auto:passed');

            for (const lbl of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: lbl });
            }
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: labelsToAdd });
            }

            // Comentario resumen
            const marker = '<!-- TAREA2-EVAL-PANEL -->';
            const reportBody = [
              marker,
              '## 📊 Panel de Evaluación — Tarea 2 (Workshop 2: AI IT Assistant)',
              '',
              `- **Grupo:** ${grupo || 'No detectado'} | **Turno:** ${turno || 'No detectado'} | **Grupo Revisor Asignado:** \`${reviewerGroup || 'No asignado'}\``,
              `- **Modalidad activa:** \`${modeText}\``,
              `- **Estado:** ${passed ? '✅ APROBADO (≥ 70 pts)' : '⏳ PENDIENTE DE REVISIÓN / CORRECCIÓN'}`,
              ...(rejectedPeerMsg ? ['', `> ${rejectedPeerMsg}`] : []),
              '',
              '### Desglose de Calificación',
              '| Componente | Puntuación Bruta | Ponderación |',
              '| :--- | :---: | :---: |',
              breakdownRows,
              `| **NOTA FINAL** | — | **${finalScore} / 100 pts** |`,
              '',
              '### Comprobaciones Automáticas (Tarea 2)',
              ...autoChecks.map(c => `- ${c}`),
              '',
              '---',
              `<sub>**Grupo ${reviewerGroup || 'Revisor'}:** Para calificar este taller, comenta \`PEER-SCORE: 85\` junto con vuestra auditoría. | **Profesores:** \`TEACHER-SCORE: 90\`.</sub>`
            ].join('\n');

            const existingBotComment = comments.find(c => c.body && c.body.includes(marker));
            if (existingBotComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingBotComment.id,
                body: reportBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: reportBody
              });
            }
