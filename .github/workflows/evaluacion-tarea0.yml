name: Evaluación Automática y Docente (Tarea 0)

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

jobs:
  evaluar-tarea-0:
    if: contains(github.event.issue.labels.*.name, 'tarea-0')
    runs-on: ubuntu-latest
    steps:
      - name: Calcular notas A (100% o 40%) y T (60%) según taller
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const body = issue.body || '';
            const currentLabels = issue.labels.map(l => l.name);

            const grupoMatch = body.match(/### Identificador de Grupo[^\n]*\n+([AB][1-6])/);
            const grupo = grupoMatch ? grupoMatch[1].trim() : null;
            const tallerMatch = body.match(/### Taller que vais a realizar[^\n]*\n+(W[1-4])/);
            const taller = tallerMatch ? tallerMatch[1].trim() : null;

            let autoRaw = 0;
            const autoChecks = [];

            // 1. Grupo y Taller (20 pts)
            if (grupo && taller) {
              autoRaw += 20;
              autoChecks.push(`✅ **Grupo (${grupo}) y Taller (${taller}) identificados:** 20/20`);
            } else {
              autoChecks.push(`❌ **Grupo o Taller no detectado:** Selecciona A1–A6/B1–B6 y W1–W4.`);
            }

            // 2. Integrantes y roles (20 pts)
            const membersBlock = body.split('### Integrantes del Equipo y Roles')[1]?.split('###')[0] || '';
            const memberLines = membersBlock.trim().split('\n').filter(l => l.trim().length > 4);
            if (memberLines.length >= 4) {
              autoRaw += 20;
              autoChecks.push(`✅ **Integrantes y roles (${memberLines.length} miembros):** 20/20`);
            } else {
              autoChecks.push(`⚠️ **Integrantes insuficientes (${memberLines.length}/4):** Añade 4–5 miembros con sus roles.`);
            }

            // 3. Checklist Base Común (20 pts)
            const baseBlock = body.split('### 1. Requisitos Base Comunes')[1]?.split('###')[0] || '';
            const baseChecked = (baseBlock.match(/- \[X\]/gi) || []).length;
            if (baseChecked >= 3) {
              autoRaw += 20;
              autoChecks.push(`✅ **Requisitos Base Comunes (${baseChecked}/3):** 20/20`);
            } else {
              autoChecks.push(`❌ **Requisitos Base incompletos (${baseChecked}/3):** Marca las 3 casillas comunes.`);
            }

            // 4. Checklist Específico del Taller seleccionado (20 pts)
            const specBlock = body.split('### 2. Requisito Específico del Taller')[1]?.split('###')[0] || '';
            const specRegex = taller ? new RegExp(`- \\[X\\]\\s*\\[${taller}`, 'i') : null;
            if (specRegex && specRegex.test(specBlock)) {
              autoRaw += 20;
              autoChecks.push(`✅ **Requisito específico de ${taller} marcado:** 20/20`);
            } else {
              autoChecks.push(`❌ **Requisito específico faltante:** Marca la casilla correspondiente a **[${taller || 'W1–W4'}]** en la sección 2.`);
            }

            // 5. Evidencia técnica CLI adaptada al taller (20 pts)
            const hasIPv4 = /\b(?:\d{1,3}\.){3}\d{1,3}\b/.test(body);
            const hasDisk = /(Use%|Avail|Mounted on|\/dev\/)/i.test(body);
            let specEvidenceOk = true;
            let specEvidenceNote = '';

            if (taller === 'W3') {
              specEvidenceOk = /packettracer/i.test(body);
              specEvidenceNote = specEvidenceOk ? ' + Packet Tracer detectado' : ' (falta salida de `which packettracer`)';
            } else if (taller === 'W4') {
              specEvidenceOk = /SUDO_OK/i.test(body);
              specEvidenceNote = specEvidenceOk ? ' + Sudo verificado' : ' (falta `SUDO_OK`)';
            }

            if (hasIPv4 && hasDisk && specEvidenceOk) {
              autoRaw += 20;
              autoChecks.push(`✅ **Evidencia CLI de ${taller || 'VM'} válida (IPv4 + Disco${specEvidenceNote}):** 20/20`);
            } else {
              autoChecks.push(`❌ **Evidencia CLI incompleta${specEvidenceNote}:** Ejecuta exactamente el comando indicado para ${taller || 'tu taller'}.`);
            }

            // Leer comentarios para calificación docente
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: issueNumber
            });

            let teacherRaw = null;
            for (const c of comments) {
              if (c.user.type === 'Bot') continue;
              const tMatch = c.body.match(/TEACHER-SCORE:\s*(\d{1,3})/i);
              if (tMatch) {
                teacherRaw = Math.min(100, Math.max(0, parseInt(tMatch[1], 10)));
              }
            }

            const hasTeacher = currentLabels.includes('teacher-review') || teacherRaw !== null;
            const tScore = teacherRaw !== null ? teacherRaw : 0;

            let finalScore = 0;
            let formulaText = '';

            if (hasTeacher) {
              const aWeighted = +(autoRaw * 0.40).toFixed(1);
              const tWeighted = +(tScore * 0.60).toFixed(1);
              finalScore = +(aWeighted + tWeighted).toFixed(1);
              formulaText = `**Modo con Revisión Docente (40% A + 60% T):**\n` +
                `- 🤖 Automática (40%): **${aWeighted} / 40 pts** *(Base: ${autoRaw}/100)*\n` +
                `- 🎓 Profesor (60%): **${tWeighted} / 60 pts** ${teacherRaw !== null ? `*(Base: ${teacherRaw}/100)*` : '*(Pendiente de TEACHER-SCORE)*'}`;
            } else {
              finalScore = autoRaw;
              formulaText = `**Modo Automático Estándar (100% A):**\n` +
                `- 🤖 Automática (100%): **${finalScore} / 100 pts**`;
            }

            const labelsToAdd = [];
            if (grupo) {
              labelsToAdd.push(`grupo-${grupo}`, grupo.startsWith('A') ? 'turno-A' : 'turno-B');
            }
            if (taller) labelsToAdd.push(taller);

            const autoPassed = autoRaw === 100;
            labelsToAdd.push(autoPassed ? 'auto:passed' : 'auto:failed');

            if (teacherRaw !== null) {
              labelsToAdd.push('teacher:graded');
            }
            try {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issueNumber,
                name: autoPassed ? 'auto:failed' : 'auto:passed'
              });
            } catch (e) {}

            await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: labelsToAdd });

            const botHeader = '<!-- BOT-EVAL-SUMMARY -->';
            const summaryBody = [
              botHeader,
              `### 📊 Panel de Evaluación — Tarea 0 ${grupo ? `(Grupo ${grupo} · ${taller || ''})` : ''}`,
              '',
              '#### 1. Desglose de Validación Automática por Taller',
              ...autoChecks,
              '',
              '#### 2. Calificación Ponderada Actual',
              formulaText,
              '',
              `### 🏆 NOTA TOTAL ACTUAL: **${finalScore} / 100 pts**`
            ].join('\n');

            const existingBotComment = comments.find(c => c.body.includes(botHeader));
            if (existingBotComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existingBotComment.id, body: summaryBody
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body: summaryBody
              });
            }
