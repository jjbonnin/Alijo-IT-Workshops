name: "Tarea 0: Validación del Entorno de Trabajo (W1–W4)"
description: "Comprobación inicial obligatoria de equipo, VM Ubuntu, Snapshot base y requisitos específicos del taller elegido (W1, W2, W3 o W4)."
title: "[TAREA-0][Grupo-XX] Validación del entorno"
labels: ["tarea-0"]
body:
  - type: markdown
    attributes:
      value: |
        ### Instrucciones de Entrega (Tarea 0)
        Completa este formulario antes de iniciar tu taller asignado. El **sistema automático (100%)** validará que tenéis exactamente el entorno necesario para vuestro taller (o **40% Automática + 60% Docente** si lo revisa el profesor).

  - type: dropdown
    id: turno
    attributes:
      label: "Turno"
      options:
        - "Turno A (08:25 - 10:10)"
        - "Turno B (10:30 - 12:15)"
    validations:
      required: true

  - type: dropdown
    id: grupo
    attributes:
      label: "Identificador de Grupo (4–5 alumnos)"
      options:
        - "A1"
        - "A2"
        - "A3"
        - "A4"
        - "A5"
        - "A6"
        - "B1"
        - "B2"
        - "B3"
        - "B4"
        - "B5"
        - "B6"
    validations:
      required: true

  - type: dropdown
    id: taller
    attributes:
      label: "Taller que vais a realizar"
      options:
        - "W1 - IT Troubleshooting Challenge"
        - "W2 - AI as an IT Technician Assistant"
        - "W3 - Build and Configure a Network"
        - "W4 - Linux Server Administration"
    validations:
      required: true

  - type: textarea
    id: integrantes
    attributes:
      label: "Integrantes del Equipo y Roles (4–5 miembros)"
      description: "Escribe el nombre y usuario de GitHub (@usuario) al lado de cada rol (borra la última línea si sois 4)."
      value: |
        - Coordinator: 
        - Lead Technician: 
        - Evidence Recorder: 
        - Verifier / Auditor: 
        - Support / Backup (opcional 5.º miembro): 
    validations:
      required: true

  - type: checkboxes
    id: checklist_base
    attributes:
      label: "1. Requisitos Base Comunes (Obligatorios para W1–W4)"
      options:
        - label: "VirtualBox operativo y VM Ubuntu arrancada en red aislada (NAT / Internal Network)."
          required: true
        - label: "Snapshot limpio creado antes de empezar con el nombre exacto: BASELINE – BEFORE WORKSHOP"
          required: true
        - label: "Acceso comprobado al repositorio Alijo-IT-Workshops y a las guías del taller."
          required: true

  - type: checkboxes
    id: checklist_especifico
    attributes:
      label: "2. Requisito Específico del Taller Seleccionado (Marca SOLO el de tu taller)"
      options:
        - label: "[W1 - Troubleshooting] Utilidades de diagnóstico CLI comprobadas (ip, ss, systemctl, journalctl, df, ping)."
        - label: "[W2 - AI Assistant] Acceso verificado a herramienta de IA (ChatGPT / Gemini / Claude / Copilot) y entorno sin datos reales."
        - label: "[W3 - Networking] Cisco Packet Tracer instalado y arrancando correctamente en el equipo de trabajo."
        - label: "[W4 - Linux Server] Privilegios sudo activos en la VM Ubuntu y acceso operativo a repositorios apt."

  - type: textarea
    id: evidencia_cli
    attributes:
      label: "Evidencia Técnica de Validación (Obligatoria)"
      description: |
        Ejecuta el comando correspondiente a tu taller y pega aquí la salida completa:
        - **W1 / W2:** `whoami && hostname && ip -br -4 a && df -h /`
        - **W3 (Packet Tracer):** `whoami && hostname && ip -br -4 a && df -h / && which packettracer`
        - **W4 (Linux Server):** `whoami && hostname && ip -br -4 a && df -h / && sudo -n true && echo "SUDO_OK"`
      render: bash
    validations:
      required: true
